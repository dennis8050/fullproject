name: Staging CD Pipeline

on:
  pull_request:
    branches:
      - staging
    types:
      - closed

jobs:
  deploy-staging:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    

    env:
      KUBE_NAMESPACE: staging

    steps:
      # ---------------------------
      # 1. Checkout repo
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 2. Optional sanity tests
      # ---------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend tests
        run: pytest backend --maxfail=1 --disable-warnings -q

      # ---------------------------
      # 3. Docker login (REQUIRED)
      # ---------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------
      # 4. Promote image to staging
      # ---------------------------
      - name: Promote backend image to staging
        run: |
          docker pull ${{ secrets.DOCKER_REPO_BACKEND }}:${{ github.sha }}
          docker tag  ${{ secrets.DOCKER_REPO_BACKEND }}:${{ github.sha }} \
                      ${{ secrets.DOCKER_REPO_BACKEND }}:staging
          docker push ${{ secrets.DOCKER_REPO_BACKEND }}:staging

      # ---------------------------
      # 5. Install kubectl
      # ---------------------------
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # ---------------------------
      # 6. Deploy to Staging
      # ---------------------------
      - name: Deploy to Staging
        run: |
          kubectl apply -f k8s/staging/namespace.yaml
          kubectl apply -f k8s/staging

      # ---------------------------
      # 7. Slack notification
      # ---------------------------
      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🧪 *STAGING DEPLOYMENT SUCCESSFUL*\nCommit: '${{ github.sha }}'"}' \
          $SLACK_WEBHOOK_URL
