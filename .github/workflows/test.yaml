name: Full-Stack CI/CD Pipeline

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: dens-prod

jobs:

# =========================
# 1️⃣ INFRASTRUCTURE
# =========================
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.oidc_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (INFRA)
        working-directory: terraform/envs/prod/infra
        run: terraform init -reconfigure
        #run: terraform init -input=false
      - name: Terraform Apply (INFRA)
        working-directory: terraform/envs/prod/infra
        run:  terraform plan -out=tfplan
      - name: Terraform Apply (infra)
        working-directory: terraform/envs/prod/infra
        run: terraform apply -auto-approve 
# =========================
# 2️⃣ PLATFORM (ARGO / MONITORING)
# =========================
  platform:
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.oidc_role_arn }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig  --name dens-prod --region ${{ env.AWS_REGION }}

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/dev/namespace.yaml
          kubectl apply -f k8s/dev 
          



      - name: Terraform Init (PLATFORM)
        working-directory: terraform/envs/prod/platform
        run: terraform init -reconfigure
        #run: terraform init -input=false
      - name: Terraform plan (platform)
        working-directory: terraform/envs/prod/platform
        run: terraform plan -out=tfplan -var="aws_account_id=${{ secrets.TF_AWS_ACCOUNT_ID }}" -var="sso_instance_arn=${{ secrets.TF_SSO_INSTANCE_ARN }}" -var="ssl_certificate_arn=${{ secrets.TF_SSL_CERT_ARN }}" -var='group_ids=${{ secrets.TF_GROUP_IDS }}' -var="sso_client_id=${{ secrets.TF_SSO_CLIENT_ID }}" -var="sso_client_secret=${{ secrets.TF_SSO_CLIENT_SECRET }}" -var="sso_auth_url=${{ secrets.TF_SSO_AUTH_URL }}" -var="sso_token_url=${{ secrets.TF_SSO_TOKEN_URL }}" -var="sso_api_url=${{ secrets.TF_SSO_API_URL }}" -var="oidc_role_arn=${{secrets.oidc_role_arn}}"

      - name: Terraform Apply (PLATFORM)
        working-directory: terraform/envs/prod/platform
        run: terraform apply -auto-approve tfplan
# =========================
# 3️⃣ BUILD & PUSH IMAGES
# =========================
  build:
    runs-on: ubuntu-latest
    needs: platform
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -t ${{ secrets.DOCKER_REPO_BACKEND }}:${{ github.sha }} backend
          docker push ${{ secrets.DOCKER_REPO_BACKEND }}:${{ github.sha }}

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_REPO_FRONTEND }}:${{ github.sha }} frontend
          docker push ${{ secrets.DOCKER_REPO_FRONTEND }}:${{ github.sha }}

# =========================
# 4️⃣ DEPLOY (ARGOCD)
# =========================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger ArgoCD Sync
        run: echo "ArgoCD will deploy automatically"
