name: Full-Stack CI/CD Pipeline

on:
  push:
    branches:
      - dev  # Trigger on push to dev branch

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python for backend tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend tests
        run: |
          cd backend
          pip install -r requirements.txt
          pytest --maxfail=1 --disable-warnings -q

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push backend image
      - name: Build & Push Backend Image
        run: |
          BACKEND_IMAGE=${{ secrets.DOCKER_REPO_BACKEND }}:${{ github.sha }}
          docker build -t $BACKEND_IMAGE ./backend
          docker push $BACKEND_IMAGE
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> $GITHUB_ENV

      # Step 5: Build and push frontend image
      - name: Build & Push Frontend Image
        run: |
          FRONTEND_IMAGE=${{ secrets.DOCKER_REPO_FRONTEND }}:${{ github.sha }}
          docker build -t $FRONTEND_IMAGE ./frontend
          docker push $FRONTEND_IMAGE
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> $GITHUB_ENV

      # Step 6: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 7: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0
       # Step 8: Terraform Init
      - name: Terraform Init
        working-directory: terraform/backend
        run: terraform init -input=false

      # Step 9: Terraform Plan
      - name: Terraform Plan
        working-directory: terraform/backend
        run: terraform plan -out=tfplan -input=false -var="env=dev"


      # Step 10: Terraform Apply
      - name: Terraform Apply
        working-directory: terraform/backend
        run: terraform apply -var="env=dev"

      

      # Step 8: Terraform Init
      - name: Terraform Init
        working-directory: terraform/envs/dev
        run: terraform init -input=false

      # Step 9: Terraform Plan
      - name: Terraform Plan
        working-directory: terraform/envs/dev
        run: terraform plan -out=tfplan -input=false

      # Step 10: Terraform Apply
      - name: Terraform Apply
        working-directory: terraform/envs/dev
        run: terraform apply -input=false tfplan

      # Step 11: Update kubeconfig for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name dev-eks --region us-east-1

      # Step 12: Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/frontend frontend=${{ env.FRONTEND_IMAGE }} -n dev
          kubectl set image deployment/backend backend=${{ env.BACKEND_IMAGE }} -n dev
          kubectl rollout status deployment/frontend -n dev
          kubectl rollout status deployment/backend -n dev
