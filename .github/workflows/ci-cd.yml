name: Full-Stack CI/CD Pipeline

on:
  push:
    branches:
      - dev

permissions:
  id-token: write        # REQUIRED FOR OIDC
  contents: read

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1

    steps:
      # ---------------------------
      # 1. Checkout repo
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 2. Set up Python for backend tests
      # ---------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend tests
        run: |
          cd backend
          pytest --maxfail=1 --disable-warnings -q

      # ---------------------------
      # 3. Log in to Docker Hub
      # ---------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------
      # 4. Authenticate with AWS using OIDC
      # ---------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311141540332:role/userRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Test identity
        run: aws sts get-caller-identity

      # ---------------------------
      # 5. Setup Terraform
      # ---------------------------
      #- name: Setup Terraform
       # uses: hashicorp/setup-terraform@v2
        #with:
         # terraform_version: 1.11.4

      #- name: Terraform Init
       # working-directory: terraform/envs/dev
        #run: terraform init -input=false

      #- name: Terraform Plan
       # working-directory: terraform/envs/dev
        #run: terraform plan -out=tfplan -input=false

      #- name: Terraform Apply
       # working-directory: terraform/envs/dev
        #run: terraform destroy -auto-approve

      # ---------------------------
      # 6. Install kubectl
      # ---------------------------
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # ---------------------------
      # 7. Wait for EKS cluster & nodes
      # ---------------------------
      #- name: Wait for EKS cluster
      #  run: |
       #   aws eks wait cluster-active --name dev-eks --region ${{ env.AWS_REGION }}
      #    aws eks wait nodegroup-active --cluster-name dev-eks --nodegroup-name dev-eks-nodes --region ${{ env.AWS_REGION }}

      # ---------------------------
      # 8. Update kubeconfig
      # ---------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name dev-eks --region ${{ env.AWS_REGION }}

      # ---------------------------
      # 9. Apply Kubernetes manifests (IMPORTANT)
      # ---------------------------
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/dev/namespace.yaml
          kubectl apply -f k8s/dev 

          

      # ---------------------------
      # 10. Build & push backend image
      # ---------------------------
      - name: Build & Push Backend Image
        run: |
          BACKEND_IMAGE=${{ secrets.DOCKER_REPO_BACKEND }}:${{ github.sha }}
          docker build -t $BACKEND_IMAGE ./backend
          docker push $BACKEND_IMAGE
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> $GITHUB_ENV

      # ---------------------------
      # 11. Build & push frontend image
      # ---------------------------
      - name: Build & Push Frontend Image
        run: |
          FRONTEND_IMAGE=${{ secrets.DOCKER_REPO_FRONTEND }}:${{ github.sha }}
          docker build -t $FRONTEND_IMAGE ./frontend
          docker push $FRONTEND_IMAGE
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> $GITHUB_ENV

      # ---------------------------
      # 12. Rollout Deployments
      # ---------------------------
      - name: Update image in manifests
        run: |
          sed -i "s|image: .*|image: ${{ env.FRONTEND_IMAGE }}|" k8s/dev/frontend.yaml
          sed -i "s|image: .*|image: ${{ env.BACKEND_IMAGE }}|" k8s/dev/backend.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/dev/frontend.yaml k8s/dev/backend.yaml
          git commit -m "Update images to ${{ github.sha }}"
          git push

     