name: Dev CD Pipeline

on:
  push:
    branches:
      -   # trigger only when pushing to dev

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest
    env:
      KUBE_NAMESPACE: dev

    steps:
      # ---------------------------
      # 1. Checkout repo
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 2. Set up Python for backend tests
      # ---------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Optional pip caching
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend tests
        run: pytest backend --maxfail=1 --disable-warnings -q

      # ---------------------------
      # 3. Log in to Docker Hub
      # ---------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------
      # 4. Install kubectl
      # ---------------------------
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      # ---------------------------
      # 5. Build & push backend image
      # ---------------------------
      - name: Build & Push Backend Image
        run: |
          BACKEND_IMAGE=${{ secrets.DOCKER_REPO_BACKEND }}:${{ github.sha }}
          docker build -t $BACKEND_IMAGE ./backend
          docker push $BACKEND_IMAGE
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> $GITHUB_ENV

      # ---------------------------
      # 6. Build & push frontend image
      # ---------------------------
      - name: Build & Push Frontend Image
        run: |
          FRONTEND_IMAGE=${{ secrets.DOCKER_REPO_FRONTEND }}:${{ github.sha }}
          docker build -t $FRONTEND_IMAGE ./frontend
          docker push $FRONTEND_IMAGE
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> $GITHUB_ENV

      # ---------------------------
      # 7. Deploy to dev cluster
      # ---------------------------
      - name: Apply Kubernetes Manifests
        run: |
          # Replace image tags dynamically using env variables
          sed -i "s|image: .*|image: ${{ env.FRONTEND_IMAGE }}|" k8s/dev/frontend.yaml
          sed -i "s|image: .*|image: ${{ env.BACKEND_IMAGE }}|" k8s/dev/backend.yaml

          # Apply manifests
          kubectl apply -f k8s/dev/namespace.yaml
          kubectl apply -f k8s/dev

      # ---------------------------
      # 8. Optional Slack notification
      # ---------------------------
      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ Dev deployment successful: '${{ github.sha }}'"}' \
            $SLACK_WEBHOOK_URL
