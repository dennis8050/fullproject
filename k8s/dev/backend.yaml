apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kofitone/dev-backend:6310999c4ed3f76665009787f0a5863d2aaf8ba6
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: userapp-config   # ConfigMap must exist in dev namespace
            - secretRef:
                name: userapp-secret   # Secret must exist in dev namespace
          resources:
            requests:
              cpu: "500m"      # minimum CPU guaranteed
              memory: "512Mi"  # minimum RAM guaranteed
            limits:
              cpu: "1"         # maximum CPU allowed
              memory: "1Gi"    # maximum RAM allowed
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dev
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70