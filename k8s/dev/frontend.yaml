apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kofitone/dev-frontend:148c0fbe8185226ace5789d7d6e44f8cc791a06f
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"       # minimum CPU guaranteed
              memory: "256Mi"   # minimum RAM guaranteed
            limits:
              cpu: "500m"       # maximum CPU allowed
              memory: "512Mi"   # maximum RAM allowed
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dev
  # Removed AWS load balancer annotation
spec:
  type: ClusterIP       # Internal-only service, exposed via ingress
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
